<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Enter passcode — Celebratory six-pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eff2fa;
    --surface: #ffffff;
    --border: #e2e8f8;
    --border-focus: #ff3c00;
    --text: #151923;
    --text-subtle: #526789;
    --primary: #ff3c00;
    --primary-hover: #db3300;
    --on-primary: #ffffff;
    --error: #d1203d;
    --error-bg: #ffe4e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Ubuntu', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { width: 22px; height: 22px; display: block; }
  .copy { display: flex; flex-direction: column; gap: 6px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; }
  p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-subtle); }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 13px; font-weight: 500; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .input-wrap { position: relative; display: flex; }
  input {
    width: 100%;
    height: 48px;
    padding: 0 48px 0 14px;
    font: inherit;
    font-size: 16px;
    letter-spacing: 0.08em;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(255,60,0,.18); }
  input[aria-invalid="true"] { border-color: var(--error); }
  .toggle {
    position: absolute;
    right: 6px;
    top: 6px;
    height: 36px;
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text-subtle);
    cursor: pointer;
  }
  .toggle:hover { background: var(--bg); }
  .toggle svg { width: 18px; height: 18px; }
  .error {
    display: none;
    padding: 10px 12px;
    font-size: 13px;
    border-radius: 8px;
    color: var(--error);
    background: var(--error-bg);
  }
  .error[data-show="true"] { display: block; }
  button[type="submit"] {
    height: 48px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--on-primary);
    background: var(--primary);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s;
  }
  button[type="submit"]:hover { background: var(--primary-hover); }
  button[type="submit"]:disabled { opacity: .6; cursor: default; }
  .shake { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10" width="16" height="11" rx="2"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </svg>
  </div>
  <div class="copy">
    <h1 id="title">Prototypes are locked</h1>
    <p>Enter the passcode to view the celebratory six-pack card prototypes.</p>
  </div>
  <form id="form" novalidate>
    <div class="field">
      <label for="passcode">Passcode</label>
      <div class="input-wrap">
        <input id="passcode" name="passcode" type="password" autocomplete="current-password" autofocus required aria-describedby="error">
        <button type="button" class="toggle" id="toggle" aria-label="Show passcode" aria-pressed="false">
          <svg id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="error" id="error" role="alert" data-show="false">Incorrect passcode. Please try again.</div>
    <button type="submit" id="submit">Unlock</button>
  </form>
</main>

<script>
(function () {
  var KEY = 'sixpack_unlocked';
  // SHA-256 of the passcode. To change it, run: printf 'newpass' | sha256sum
  var HASH = '2319539cb92bdae8ab051cb211f66c987ea94e787ee8b6e45588c1a817b2430d';

  var params = new URLSearchParams(location.search);
  var next = params.get('next') || 'option-a.html';
  // Only allow same-directory relative targets to avoid open redirects.
  if (/^(https?:)?\/\//i.test(next) || next.indexOf('..') !== -1 || next.charAt(0) === '/') next = 'option-a.html';

  if (sessionStorage.getItem(KEY) === '1') { location.replace(next); return; }

  var form = document.getElementById('form');
  var input = document.getElementById('passcode');
  var error = document.getElementById('error');
  var submit = document.getElementById('submit');
  var toggle = document.getElementById('toggle');
  var card = document.querySelector('.card');

  toggle.addEventListener('click', function () {
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    toggle.setAttribute('aria-pressed', String(!showing));
    toggle.setAttribute('aria-label', showing ? 'Show passcode' : 'Hide passcode');
    input.focus();
  });

  async function sha256(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var value = input.value.trim();
    if (!value) { input.focus(); return; }
    submit.disabled = true;
    var ok = (await sha256(value)) === HASH;
    if (ok) {
      sessionStorage.setItem(KEY, '1');
      location.replace(next);
      return;
    }
    submit.disabled = false;
    input.setAttribute('aria-invalid', 'true');
    error.setAttribute('data-show', 'true');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    input.select();
  });

  input.addEventListener('input', function () {
    input.removeAttribute('aria-invalid');
    error.setAttribute('data-show', 'false');
  });
})();
</script>
</body>
</html>
